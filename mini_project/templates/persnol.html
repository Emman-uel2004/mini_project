<!DOCTYPE html>
<html>
<head>
    <title>Personal Details</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='persnol.css') }}">

</head>

<body>

<div class="container">

    <h2>Personal Details</h2>

    <form action="/persnol" method="POST">

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name">

        <label>Initial</label>
        <input type="text" name="initial" placeholder="Enter initial">
        
        <label>Date of Birth</label>
        <input type="date" name="dob">

         <label>Gender</label>
        <select name="gender">
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="femal">Femal</option>
            <option value="others">Others</option>

        </select>

        <label>Father Name</label>
        <input type="text" name="father_name" placeholder="Enter father name">

        <label>Mother Name</label>
        <input type="text" name="mother_name" placeholder="Enter mother name">

        <label>Blood Group</label>
        <select name="blood_group">
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Admission Type</label>
        <select name="admission_type">
            <option value="">Select Type</option>
            <option value="Management">Management</option>
            <option value="Government">Government</option>
        </select>

        <label>Contact Number</label>
        <input type="text" name="contact" placeholder="Enter mobile number">

        <label>Email</label>
        <input type="text" name="email" placeholder="Enter Email Id">

             <label>Nationality</label>
        <select name="nationality">
            <option value="">Select Nationality</option>
            <option value="india">INDIA</option>
            <option value="usa">USA</option>
            <option value="canada">CANADA</option>
            <option value="africa">AFRICA</option>
            <option value="barginofao">BARGINOFASO</option>
            <option value="nigeriya">NIGERIYA</option>
        </select> 

        <label>Aadhar Number</label>
        <input type="number" name="aadhar" placeholder="Enter Aadhar Number">

        <label>Cast</label>
        <input type="text" name="cast" placeholder="Enter Cast">


        <label>Mother Tongue</label>
        <input type="text" name="mother_tongue" placeholder="Enter mother tongue">


        <button type="submit" class="btn">Next</button>

    </form>

</div>

</body>
</html>
